name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure VanillaHelpers (Win32)
        run: cmake -S VanillaHelpers -B build-dll -G "Visual Studio 18 2026" -A Win32

      - name: Build VanillaHelpers.dll
        run: cmake --build build-dll --config Release --parallel

      - name: Configure TextureServer64 (x64)
        run: cmake -S TextureServer64 -B build-server -G "Visual Studio 18 2026" -A x64

      - name: Build TextureServer64.exe
        run: cmake --build build-server --config Release --parallel

      - name: List build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build-dll,build-server -Include *.dll,*.exe -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VanillaHelpers64
          path: |
            build-dll/**/VanillaHelpers.dll
            build-server/**/TextureServer64.exe
          if-no-files-found: error
          retention-days: 14
